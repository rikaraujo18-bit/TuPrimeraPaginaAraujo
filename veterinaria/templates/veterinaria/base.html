<!DOCTYPE html>
<html>
<head>
    <title>Veterinaria - {% block title %}{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #2c3e50;
            padding: 10px;
            margin-bottom: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
            padding: 5px 10px;
        }
        nav a:hover {
            background-color: #3498db;
            border-radius: 5px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            margin: auto;
        }
        h1 {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'agregar_cliente' %}">Agregar Cliente</a>
        <a href="{% url 'agregar_mascota' %}">Agregar Mascota</a>
        <a href="{% url 'agregar_consulta' %}">Agregar Consulta</a>
        <a href="{% url 'buscar' %}">Buscar</a>
        <a href="/admin">Admin</a>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
