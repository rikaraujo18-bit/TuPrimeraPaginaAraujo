{% extends "veterinaria/base.html" %}

{% block title %}Eliminar {{ mascota.nombre }}{% endblock %}

{% block content %}
<h1>Eliminar Mascota</h1>

<p>¿Estás seguro de que querés eliminar a <strong>{{ mascota.nombre }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'detalle_mascota' mascota.id %}">Cancelar</a>
</form>

{% endblock %}
